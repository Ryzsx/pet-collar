<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Redirecting | PawSense</title>
</head>
<body>
    <p>Redirecting to <a href="forgot-password.html">Forgot Password</a>…</p>
    <script>
        const destination = `forgot-password.html${window.location.search}${window.location.hash}`;
        window.location.replace(destination);
    </script>
</body>
</html>
