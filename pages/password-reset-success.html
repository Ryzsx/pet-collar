<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#217A3D">
    <meta name="robots" content="noindex">
    <title>Password Changed | PawSense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body>
    <main class="reset-page">
        <article class="reset-card" aria-labelledby="resetSuccessTitle">
            <a class="reset-brand" href="../index.html" aria-label="PawSense home">
                <span><i class="bi bi-heart-pulse-fill"></i></span>
                <strong>Paw<span>Sense</span></strong>
            </a>

            <section role="status" aria-live="polite">
                <header class="reset-header">
                    <span class="reset-header-icon"><i class="bi bi-check2"></i></span>
                    <p class="eyebrow">Password updated</p>
                    <h1 id="resetSuccessTitle">Password <span>Changed</span></h1>
                    <p>Your new password was saved successfully. You can now use it to sign in.</p>
                </header>
                <a class="primary-button" href="login.html">Go Back to Login</a>
            </section>
        </article>
    </main>
</body>
</html>
